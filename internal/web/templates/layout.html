{{define "layout"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}} — Skipper</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"></script>
    <link rel="stylesheet" href="/static/css/output.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      })();
      function syncParams(params) {
        var u = new URL(location.href);
        var changed = false;
        for (var k in params) {
          var v = params[k];
          var cur = u.searchParams.get(k);
          if (v && v !== "") {
            if (cur !== v) {
              u.searchParams.set(k, v);
              changed = true;
            }
          } else {
            if (cur !== null) {
              u.searchParams.delete(k);
              changed = true;
            }
          }
        }
        if (changed) history.replaceState(null, "", u.toString());
      }
    </script>
  </head>
  <body>
    {{$nav := activeNav .Title}}
    <nav class="nav-bar">
      <a href="/" class="nav-logo">skipper</a>
      <a href="/" class="nav-link{{if eq $nav `/`}} nav-link-active{{end}}">Dashboard</a>
      <div class="nav-divider"></div>
      <a href="/functions" class="nav-link{{if eq $nav `/functions`}} nav-link-active{{end}}">Functions</a>
      <a href="/tenants" class="nav-link{{if eq $nav `/tenants`}} nav-link-active{{end}}">Tenants</a>
      <a href="/deployments" class="nav-link{{if eq $nav `/deployments`}} nav-link-active{{end}}">Deployments</a>
      <div class="nav-divider"></div>
      <a href="/controllers" class="nav-link{{if eq $nav `/controllers`}} nav-link-active{{end}}">Controllers</a>
      <a href="/routers" class="nav-link{{if eq $nav `/routers`}} nav-link-active{{end}}">Routers</a>
      <div class="nav-divider"></div>
      <a href="/events" class="nav-link{{if eq $nav `/events`}} nav-link-active{{end}}">Events</a>
      <a href="/config" class="nav-link{{if eq $nav `/config`}} nav-link-active{{end}}">Config</a>
      <button id="theme-toggle" type="button" class="theme-toggle" title="Toggle theme">
        <svg id="theme-icon-system" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          />
        </svg>
        <svg id="theme-icon-light" class="hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          />
        </svg>
        <svg id="theme-icon-dark" class="hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
      </button>
      <script>
        (function () {
          var btn = document.getElementById("theme-toggle");
          var modes = ["system", "light", "dark"];
          function current() {
            return document.documentElement.dataset.theme || "system";
          }
          function apply(mode) {
            var icons = ["system", "light", "dark"];
            icons.forEach(function (i) {
              document.getElementById("theme-icon-" + i).classList.toggle("hidden", i !== mode);
            });
            if (mode === "system") {
              delete document.documentElement.dataset.theme;
              localStorage.removeItem("theme");
            } else {
              document.documentElement.dataset.theme = mode;
              localStorage.setItem("theme", mode);
            }
            btn.title = mode.charAt(0).toUpperCase() + mode.slice(1) + " theme";
          }
          apply(current());
          btn.addEventListener("click", function () {
            var i = modes.indexOf(current());
            apply(modes[(i + 1) % 3]);
          });
        })();
      </script>
    </nav>
    <main class="app-main">{{template "content" .}}</main>
  </body>
</html>
{{end}}
