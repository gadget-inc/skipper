{{define "content"}}
<div class="page-header">
  <h1>Configuration</h1>
</div>
{{if not .State.GetConfig}}
<div class="empty-state">No configuration values</div>
{{else}}
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Parameter</th>
        <th>Value</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      {{range .State.GetConfig}}
      <tr>
        <td>{{.GetName}}</td>
        <td class="mono">{{.GetValue}}</td>
        <td class="muted">{{.GetDescription}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}} {{end}}
