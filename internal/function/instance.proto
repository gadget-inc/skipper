syntax = "proto3";

option go_package = "github.com/gadget-inc/skipper/internal/function";

package function;

import "function.proto";
import "google/protobuf/timestamp.proto";

message Instance {
  Function function = 1;
  string name = 2;
  string addr = 3;
  string replica_set = 4;
  google.protobuf.Timestamp assigned_at = 5;
  google.protobuf.Timestamp ready_at = 6;
  uint32 cpu_usage_milli = 7;
  uint32 memory_usage_mib = 8;
}
