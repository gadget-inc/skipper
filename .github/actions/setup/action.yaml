name: "Setup environment"
description: ""
inputs: {}
outputs: {}
runs:
  using: "composite"
  steps:
    - name: Install nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Cache nix
      uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Setup nix environment
      run: |
        cd nix
        source <(nix print-dev-env --show-trace)

        # Loop over each variable in the environment
        while IFS='=' read -r -d '' name value; do
            # Skip if the variable is a function or read-only or non-alphanumeric
            [[ "$(declare -p $name)" =~ "declare -[a-z]*r[a-z]* " ]] && continue
            [[ ! $name =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]] && continue

            # Check if the variable value contains a newline
            if [[ "$value" != *$'\n'* ]]; then
                # It doesn't, so write the variable and its value (stripping quotes) to the file
                echo "${name}=${value//\"/}" >> nix-env.txt
            fi
        done < <(env -0)

        # cat nix-env.txt # useful for debugging what env is exported
        cat nix-env.txt >> "$GITHUB_ENV"
      shell: bash

    - name: Restore and cache go dependencies
      uses: actions/cache@v4
      with:
        path: /home/runner/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}

    - name: Install go dependencies
      run: go mod download && go mod verify
      shell: bash

    - name: Restore and cache deno dependencies
      uses: actions/cache@v4
      with:
        path: /home/runner/.deno/deps
        key: deno-deps-${{ hashFiles('deno.lock') }}

    - name: Install deno dependencies
      run: deno install
      shell: bash
