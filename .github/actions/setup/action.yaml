name: "Setup environment"
description: ""
inputs: {}
outputs: {}
runs:
  using: "composite"
  steps:
    - name: Install nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Cache nix
      uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Setup nix environment
      run: |
        cd nix
        source <(nix print-dev-env --show-trace)
        echo "$PATH" >> "$GITHUB_PATH"
      shell: bash

    - name: Restore and cache go dependencies
      uses: actions/cache@v4
      with:
        path: /home/runner/go/pkg/mod
        key: go-mod-${{ hashFiles('go.sum') }}

    - name: Install go dependencies
      run: go mod download && go mod verify
      shell: bash

    - name: Restore and cache deno dependencies
      uses: actions/cache@v4
      with:
        path: /home/runner/.deno/deps
        key: deno-deps-${{ hashFiles('deno.lock') }}

    - name: Install deno dependencies
      run: deno install
      shell: bash
