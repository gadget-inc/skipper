name: "Set up Docker"
description: "Set up Docker for the runner"
inputs: {}
outputs: {}
runs:
  using: "composite"
  steps:
    - name: Set up Docker
      uses: docker/setup-docker-action@v4
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
