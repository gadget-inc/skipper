name: "Set up Docker"
description: "Set up Docker for the runner"
inputs: {}
outputs: {}
runs:
  using: "composite"
  steps:
    - name: Set up Blacksmith
      uses: useblacksmith/build-push-action@v1
      with:
        setup-only: true

    - name: Set up Docker
      uses: docker/setup-docker-action@v4
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
