name: cd

on:
  push:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  cd:
    needs: ci
    runs-on: ubuntu-latest-l
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Cache apt-get mounts
        uses: actions/cache@v4
        id: apt-get-mounts-cache
        with:
          key: apt-get-mounts-${{ hashFiles('Dockerfile') }}
          restore-keys: apt-get-mounts-
          path: |
            var-cache-apt
            var-lib-apt

      - name: Inject apt-get mounts cache into Docker
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "var-cache-apt": "/var/cache/apt",
              "var-lib-apt": "/var/lib/apt"
            }
          skip-extraction: ${{ steps.apt-get-mounts-cache.outputs.cache-hit }}

      - name: Cache go build mounts
        uses: actions/cache@v4
        id: go-build-mounts-cache
        with:
          key: go-build-mounts-${{ hashFiles('Dockerfile') }}
          restore-keys: go-build-mounts-
          path: |
            go-pkg-mod
            go-build

      - name: Inject go build mounts cache into Docker
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "go-pkg-mod": "/go/pkg/mod",
              "go-build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ steps.go-build-mounts-cache.outputs.cache-hit }}

      - name: Authenticate gcloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCLOUD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_EMAIL }}

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push to Google Artifact Registry
        run: |
          task build -- \
            --repo=us-central1-docker.pkg.dev/gadget-core-production/core-production/skipper \
            --platform=linux/amd64,linux/arm64 \
            --cache-from-to=registry \
            --push \
            --no-kind
