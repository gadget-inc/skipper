name: ci

on:
  workflow_call:
  pull_request:

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-environment

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: "none"

  go-test:
    runs-on: ubuntu-latest-l
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-environment

      - name: Set up Docker
        uses: ./.github/actions/setup-docker

      - name: Create kind cluster
        run: |
          cat << EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 31030
              hostPort: 31030
            - containerPort: 31031
              hostPort: 31031
          EOF
          kind create cluster --config=kind-config.yaml

      - name: Deploy
        env:
          KUBECTL_CONTEXT: kind-kind
        run: task deploy-all

      - name: Watch and persist logs
        run: |
          mkdir -p tmp/logs/
          nohup stern . --namespace=skipper-test,skipper-test-fixtures --template='{{ printf "%s/%s: %s\n" .Namespace .PodName .Message }}' | tee tmp/logs/stern.log &

      - name: Run tests
        env:
          LOG_LEVEL: debug
        run: |
          mkdir -p tmp/logs/
          task test | tee tmp/logs/test.log

      - if: always()
        name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: tmp/logs/

  deno-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-environment

      - name: Run lint
        run: deno lint
