name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run lint
        run: lint

  test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-environment
        with:
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Docker
        uses: ./.github/actions/setup-docker

      - name: Create kind cluster
        run: |
          cat << EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 31030
              hostPort: 31030
            - containerPort: 31031
              hostPort: 31031
          EOF
          kind create cluster --config=kind-config.yaml

      - name: Deploy
        env:
          SKIPPER_KUBECTL_CONTEXT: kind-kind
        run: deploy --only=skipper,fixtures

      - name: Watch and persist logs
        env:
          SKIPPER_KUBECTL_CONTEXT: kind-kind
        run: nohup logs &

      - name: Run tests
        run: tests

      - if: always()
        name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: tmp/logs/
