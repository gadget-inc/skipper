name: ci

on:
  push:
  workflow_call:
  pull_request:

env:
  GOPATH: /home/runner/go
  DENO_DIR: /home/runner/.deno

jobs:
  go-lint:
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_CACHE: /home/runner/.cache/golangci-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: "none"
          args: "--timeout 10m"

  go-test:
    runs-on: ubuntu-latest-l
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Restore and cache go mounts
        uses: actions/cache@v4
        id: go-mounts-cache
        with:
          path: |
            go-pkg-mod
          key: go-mounts-cache-${{ hashFiles('go.sum') }}

      - name: Inject go mounts cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "go-pkg-mod": "/go/pkg/mod"
            }
          skip-extraction: ${{ steps.go-mounts-cache.outputs.cache-hit }}

      - name: Restore and cache apt mounts
        uses: actions/cache@v3
        id: apt-mounts-cache
        with:
          path: |
            var-cache-apt
            var-lib-apt
          key: apt-mounts-cache-${{ hashFiles('Dockerfile') }}

      - name: Inject apt mounts cache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "var-cache-apt": "/var/cache/apt",
              "var-lib-apt": "/var/lib/apt"
            }
          skip-extraction: ${{ steps.apt-mounts-cache.outputs.cache-hit }}

      - name: Create kind cluster
        run: |
          cat << EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 31020
              hostPort: 31020
            - containerPort: 31021
              hostPort: 31021
          EOF

          kind create cluster --config=kind-config.yaml

      - name: Deploy
        env:
          KUBECTL_CONTEXT: kind-kind
        run: task deploy-all

      - name: Run tests
        run: task test

  deno-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run lint
        run: deno lint
