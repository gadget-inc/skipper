name: ci

on:
  workflow_call:
  pull_request:

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: "none"

  go-test:
    runs-on: ubuntu-latest-l
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache apt-get mounts
        uses: actions/cache@v4
        id: apt-get-mounts-cache
        with:
          key: apt-get-mounts-${{ hashFiles('Dockerfile') }}
          restore-keys: apt-get-mounts-
          path: |
            var-cache-apt
            var-lib-apt

      - name: Inject apt-get mounts cache into Docker
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          skip-extraction: ${{ steps.apt-get-mounts-cache.outputs.cache-hit }}
          cache-map: |
            {
              "var-cache-apt": "/var/cache/apt",
              "var-lib-apt": "/var/lib/apt"
            }

      - name: Cache go build mounts
        uses: actions/cache@v4
        id: go-build-mounts-cache
        with:
          key: go-build-mounts-${{ hashFiles('Dockerfile') }}
          restore-keys: go-build-mounts-
          path: |
            go-pkg-mod
            go-build

      - name: Inject go build mounts cache into Docker
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          skip-extraction: ${{ steps.go-build-mounts-cache.outputs.cache-hit }}
          cache-map: |
            {
              "go-pkg-mod": "/go/pkg/mod",
              "go-build": "/root/.cache/go-build"
            }

      - name: Create kind cluster
        run: |
          cat << EOF > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 31030
              hostPort: 31030
            - containerPort: 31031
              hostPort: 31031
          EOF
          kind create cluster --config=kind-config.yaml

      - name: Deploy
        env:
          KUBECTL_CONTEXT: kind-kind
        run: task deploy-all

      - name: Watch and persist logs
        run: |
          mkdir -p tmp/logs/
          nohup stern . --namespace=skipper-test,skipper-test-fixtures --template='{{ printf "%s/%s: %s\n" .Namespace .PodName .Message }}' | tee tmp/logs/stern.log &

      - name: Run tests
        env:
          LOG_LEVEL: debug
        run: |
          mkdir -p tmp/logs/
          task test | tee tmp/logs/test.log

      - if: always()
        name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: tmp/logs/

  deno-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run lint
        run: deno lint
