version: 3

tasks:
  build:
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
      - .goreleaser.yaml
      - go.mod
      - go.sum
      - main.go
    generates:
      - dist/*
    cmds:
      - goreleaser build --clean --snapshot

  docker-build:
    deps:
      - build
    sources:
      - dist/**/*
      - docker/fusion/**/*
      - scripts/docker-build.ts
    cmds:
      - deno run -A scripts/docker-build.ts

  docker-push:
    deps:
      - docker-build
    cmds:
      - deno run -A scripts/docker-push.ts

  deploy:
    deps:
      - docker-build
    cmds:
      - deno run -A scripts/deploy.ts

  example-deno-docker-build:
    sources:
      - docker/example-deno/**/*
      - scripts/example-deno-docker-build.ts
    cmds:
      - deno run -A scripts/example-deno-docker-build.ts

  example-deno-deploy:
    deps:
      - example-deno-docker-build
    cmds:
      - deno run -A scripts/example-deno-deploy.ts

  example-deno-request:
    cmds:
      - deno run -A scripts/example-deno-request.ts

  example-deno-websocket:
    cmds:
      - deno run -A scripts/example-deno-websocket.ts

  metrics-server-deploy:
    sources:
      - deploy/cluster/metrics-server.yaml
      - deploy/kube-system/metrics-server.yaml
      - scripts/metrics-server-deploy.ts
    cmds:
      - deno run -A scripts/metrics-server-deploy.ts
