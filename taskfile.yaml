# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

tasks:
  lint:
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
      - .golangci.yaml
      - go.mod
      - go.sum
      - main.go
    cmds:
      - golangci-lint run

  test: go test -v ./... {{ .CLI_ARGS }}

  build: scripts/build.ts {{ .CLI_ARGS }}

  deploy:
    deps: [generate-paseto-keypair, build]
    cmd: scripts/deploy.ts

  build-fixtures:
    sources: [fixtures/**/*]
    cmd: scripts/build-fixtures.ts

  deploy-fixtures:
    deps: [generate-paseto-keypair, build-fixtures]
    sources: [deploy/skipper-*-fixtures/**, scripts/deploy-fixtures.ts]
    cmd: scripts/deploy-fixtures.ts

  deploy-metrics-server:
    sources: [deploy/cluster/metrics-server.yaml, deploy/kube-system/metrics-server.yaml, scripts/deploy-metrics-server.ts]
    cmd: scripts/deploy-metrics-server.ts

  deploy-otel-lgtm:
    sources: [deploy/otel-lgtm/**, scripts/deploy-otel-lgtm.ts]
    cmd: scripts/deploy-otel-lgtm.ts

  deploy-all:
    cmds:
      - task: deploy-metrics-server
      - task: deploy-otel-lgtm
      - task: deploy-fixtures
      - task: deploy

  echo-request: scripts/echo-request.ts
  echo-websocket: scripts/echo-websocket.ts
  echo-load-test: scripts/echo-load-test.ts

  generate-paseto-keypair:
    sources: [scripts/generate-paseto-keypair.ts]
    generates: [tmp/paseto/public.pem, tmp/paseto/private.pem]
    cmd: scripts/generate-paseto-keypair.ts
