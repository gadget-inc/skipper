# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

tasks:
  test:
    cmds:
      - go test -v ./... {{ .CLI_ARGS }}

  build:
    cmds:
      - scripts/build.ts {{ .CLI_ARGS }}

  build-fixtures:
    sources:
      - fixtures/**/*
    cmds:
      - scripts/build-fixtures.ts

  deploy:
    deps:
      - generate-paseto-keypair
      - build
    cmds:
      - scripts/deploy.ts

  deploy-fixtures:
    deps:
      - generate-paseto-keypair
      - build-fixtures
    sources:
      - deploy/fusion-fixtures-*/**
      - scripts/deploy-fixtures.ts
    cmds:
      - scripts/deploy-fixtures.ts

  deploy-metrics-server:
    sources:
      - deploy/cluster/metrics-server.yaml
      - deploy/kube-system/metrics-server.yaml
      - scripts/deploy-metrics-server.ts
    cmds:
      - scripts/deploy-metrics-server.ts

  deploy-otel-lgtm:
    sources:
      - deploy/otel-lgtm/**
      - scripts/deploy-otel-lgtm.ts
    cmds:
      - scripts/deploy-otel-lgtm.ts

  deploy-all:
    cmds:
      - task: deploy-metrics-server
      - task: deploy-otel-lgtm
      - task: deploy-fixtures
      - task: deploy

  echo-request:
    cmds:
      - scripts/echo-request.ts

  echo-websocket:
    cmds:
      - scripts/echo-websocket.ts

  generate-paseto-keypair:
    sources:
      - scripts/generate-paseto-keypair.ts
    generates:
      - tmp/paseto/public.pem
      - tmp/paseto/private.pem
    cmds:
      - scripts/generate-paseto-keypair.ts

  lint:
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
      - .golangci.yaml
      - go.mod
      - go.sum
      - main.go
    cmds:
      - golangci-lint run
