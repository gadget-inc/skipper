version: 3

tasks:
  lint:
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
      - .golangci.yaml
      - go.mod
      - go.sum
      - main.go
    cmds:
      - golangci-lint run

  test:
    cmds:
      - go test -v ./... {{.CLI_ARGS}}

  build:
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
      - .goreleaser.yaml
      - go.mod
      - go.sum
      - main.go
    generates:
      - dist/*
    cmds:
      - goreleaser build --clean --snapshot

  docker-build:
    deps:
      - build
    sources:
      - dist/**/*
      - docker/fusion/**/*
      - scripts/docker-build.ts
    cmds:
      - deno run -A scripts/docker-build.ts

  docker-push:
    deps:
      - docker-build
    cmds:
      - deno run -A scripts/docker-push.ts

  deploy:
    deps:
      - docker-build
    cmds:
      - deno run -A scripts/deploy.ts

  fixtures-docker-build:
    sources:
      - docker/fixtures/**/*
      - scripts/fixtures-docker-build.ts
    cmds:
      - deno run -A scripts/fixtures-docker-build.ts

  fixtures-deploy:
    deps:
      - fixtures-docker-build
    cmds:
      - deno run -A scripts/fixtures-deploy.ts

  metrics-server-deploy:
    sources:
      - deploy/cluster/metrics-server.yaml
      - deploy/kube-system/metrics-server.yaml
      - scripts/metrics-server-deploy.ts
    cmds:
      - deno run -A scripts/metrics-server-deploy.ts

  echo-request:
    cmds:
      - deno run -A scripts/echo-request.ts

  echo-websocket:
    cmds:
      - deno run -A scripts/echo-websocket.ts
