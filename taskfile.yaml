# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: 3

tasks:
  test:
    cmds:
      - go test -v ./... {{.CLI_ARGS}}

  build:
    cmds:
      - scripts/build.ts

  build-fixtures:
    sources:
      - fixtures/**/*
      - scripts/build-fixtures.ts
    cmds:
      - scripts/build-fixtures.ts

  deploy:
    deps:
      - generate-paseto-keypair
      - build
    cmds:
      - scripts/deploy.ts

  deploy-fixtures:
    deps:
      - generate-paseto-keypair
      - build-fixtures
    cmds:
      - scripts/deploy-fixtures.ts

  deploy-metrics-server:
    sources:
      - deploy/cluster/metrics-server.yaml
      - deploy/kube-system/metrics-server.yaml
      - scripts/deploy-metrics-server.ts
    cmds:
      - scripts/deploy-metrics-server.ts

  deploy-all:
    deps:
      - deploy-metrics-server
      - deploy-fixtures
      - deploy

  echo-request:
    cmds:
      - scripts/echo-request.ts

  echo-websocket:
    cmds:
      - scripts/echo-websocket.ts

  generate-paseto-keypair:
    sources:
      - scripts/generate-paseto-keypair.ts
    generates:
      - tmp/paseto/public.pem
      - tmp/paseto/private.pem
    cmds:
      - scripts/generate-paseto-keypair.ts

  lint:
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - pkg/**/*.go
      - .golangci.yaml
      - go.mod
      - go.sum
      - main.go
    cmds:
      - golangci-lint run
