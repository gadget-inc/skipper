---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skipper-development-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skipper-development-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: skipper-development-controller
subjects:
  - kind: ServiceAccount
    name: skipper-development-controller
    namespace: skipper-development
