---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: example-development-fusion-editor
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-development-fusion-editor-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: example-development-fusion-editor
subjects:
  - kind: ServiceAccount
    name: fusion-editor
    namespace: fusion-development
