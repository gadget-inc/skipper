apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deno
  labels:
    app.kubernetes.io/managed-by: fusion
    fusion/deployment: example-deno
    fusion/status: unassigned
  annotations:
    shipit.shopify.io/restart: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: fusion
      fusion/deployment: example-deno
      fusion/status: unassigned
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: fusion
        fusion/deployment: example-deno
        fusion/status: unassigned
    spec:
      containers:
        - name: deno
          image: fusion-example-deno:latest
          imagePullPolicy: Never
          ports:
            - name: http-port
              containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
