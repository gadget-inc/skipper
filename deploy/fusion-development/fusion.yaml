---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion
  labels:
    app.kubernetes.io/name: fusion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fusion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fusion
    spec:
      serviceAccountName: fusion-editor
      containers:
        - name: fusion
          image: fusion:latest
          imagePullPolicy: Never
          args: ["serve", "--namespace=example-development", "--log-format=text"]
          ports:
            - name: http-port
              containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: fusion
spec:
  selector:
    app.kubernetes.io/name: fusion
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http-port
