version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ./internal/skipper/
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: ./internal/skipper/
    opt:
      - paths=source_relative
  - remote: buf.build/community/mfridman-go-json
    out: ./internal/skipper/
    opt:
      - paths=source_relative
      - orig_name=true
  - local: ./web/node_modules/.bin/protoc-gen-es
    out: ./web/src/gen/
    opt:
      - target=ts
      - import_extension=ts
      - ts_nocheck=true
